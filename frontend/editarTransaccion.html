<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestorF – Editar Registro</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>body { padding: 30px; align-items: flex-start; }</style>
</head>
<body>
  <div class="card" style="max-width:500px;">
    <h2>Editar <span>Registro</span></h2>
    <div id="error" class="alert-error" style="display:none;"></div>
    <div class="form-group">
      <label>Categoría</label>
      <select id="id_categoria"></select>
    </div>
    <div class="form-group">
      <label>Fecha</label>
      <input type="date" id="fecha">
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input type="text" id="descripcion">
    </div>
    <div class="form-group">
      <label>Monto</label>
      <input type="number" id="monto" step="0.01" min="0.01">
    </div>
    <button class="btn btn-primary" onclick="actualizar()">Guardar cambios</button>
    <div class="actions"><a href="registros.html" class="link">← Volver</a></div>
  </div>
  <script src="js/editarTransaccion.js"></script>
</body>
</html>
