<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestorF – Auditoría</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { 
      padding: 0; 
      align-items: stretch; 
    }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar inyectado dinámicamente -->
  <div id="sidebar"></div>

  <!-- Contenido principal -->
  <div class="main-content">
    <div class="page-header" style="max-width:1000px;">
      <h2>Reporte de <span style="color:var(--accent)">Auditoría</span></h2>
      <a href="dashboard.html" class="btn btn-secondary">← Volver</a>
    </div>

    <!-- Filtro por fecha -->
    <div class="card" style="max-width:500px; margin-bottom:24px;">
      <h2 style="font-size:1rem; margin-bottom:16px;">Filtrar por fecha</h2>
      <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
        <div class="form-group" style="margin-bottom:0; flex:1;">
          <label for="desde">Desde</label>
          <input type="date" id="desde">
        </div>
        <div class="form-group" style="margin-bottom:0; flex:1;">
          <label for="hasta">Hasta</label>
          <input type="date" id="hasta">
        </div>
        <button class="btn btn-primary" style="width:auto; padding:10px 20px;" onclick="filtrar()">Filtrar</button>
        <button class="btn btn-secondary" style="padding:10px 16px;" onclick="limpiar()">Limpiar</button>
      </div>
    </div>

    <div class="table-wrapper" style="max-width:1000px;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>ID Transacción</th>
            <th>Acción</th>
            <th>Fecha</th>
            <th>Descripción</th>
          </tr>
        </thead>
        <tbody id="tablaAuditoria">
          <tr><td colspan="5" style="text-align:center; color:var(--muted);">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Scripts en orden correcto -->
<script src="js/sidebar.js"></script>
<script src="js/auditoria.js"></script>
</body>
</html>
