<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestorF – Registrar Ingreso</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding: 0; align-items: stretch; }
  </style>
</head>
<body>

<div class="app-layout">

  <div id="sidebar"></div>

  <div class="main-content">
    <div class="card" style="max-width:500px;">
      <h2>Registrar <span>Ingreso</span></h2>
      <div id="error" class="alert-error" style="display:none;"></div>
      <div class="form-group">
        <label for="id_categoria">Categoría</label>
        <select id="id_categoria"></select>
      </div>
      <div class="form-group">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha">
      </div>
      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion">
      </div>
      <div class="form-group">
        <label for="monto">Monto</label>
        <input type="number" id="monto" step="0.01" min="0.01">
      </div>
      <button class="btn btn-primary" onclick="registrar()">Registrar</button>
      <div class="actions"><a href="dashboard.html" class="link">← Volver</a></div>
    </div>
  </div>

</div>

<script src="js/sidebar.js"></script>
<script src="js/regIngreso.js"></script>
</body>
</html>
