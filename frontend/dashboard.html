<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestorF – Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { 
      padding: 0; 
      align-items: stretch; 
    }
    .balance-grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 16px; 
      margin-bottom: 32px; 
    }
    .balance-card { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 20px 24px; 
    }
    .balance-card .label { 
      font-size: 0.75rem; 
      color: var(--muted); 
      text-transform: uppercase; 
      letter-spacing: 0.08em; 
      margin-bottom: 8px; 
    }
    .balance-card .valor { 
      font-size: 1.6rem; 
      font-weight: 700; 
    }
    .valor.ingreso { color: var(--success); }
    .valor.gasto { color: var(--danger); }
  </style>
</head>
<body>

<div class="app-layout">

  <!-- Sidebar inyectado dinámicamente -->
  <div id="sidebar"></div>

  <!-- Contenido principal -->
  <div class="main-content">
    <h2 style="margin-bottom:24px;">Resumen financiero</h2>

    <div class="balance-grid">
      <div class="balance-card">
        <div class="label">Total ingresos</div>
        <div class="valor ingreso" id="totalIngresos">$0.00</div>
      </div>
      <div class="balance-card">
        <div class="label">Total gastos</div>
        <div class="valor gasto" id="totalGastos">$0.00</div>
      </div>
      <div class="balance-card">
        <div class="label">Balance actual</div>
        <div class="valor" id="balanceActual">$0.00</div>
      </div>
    </div>

    <div style="display:flex; gap:12px;">
      <a href="regIngreso.html" class="btn btn-primary" style="width:auto; padding:10px 24px;">+ Registrar ingreso</a>
      <a href="regGasto.html"   class="btn btn-secondary" style="padding:10px 24px;">− Registrar gasto</a>
      <a href="registros.html"  class="btn btn-secondary" style="padding:10px 24px;">Ver todos los registros</a>
    </div>
  </div>

</div>

<!-- Scripts en orden correcto -->
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
