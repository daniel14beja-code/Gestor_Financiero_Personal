<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestorF – Registro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="card">
    <h2>Crear <span>Cuenta</span></h2>

    <div id="error" class="alert-error" style="display:none;"></div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="nombre">
    </div>
    <div class="form-group">
      <label>Apellido</label>
      <input type="text" id="apellido">
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="username">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password">
    </div>
    <div class="form-group">
      <label>Confirmar contraseña</label>
      <input type="password" id="confirm">
    </div>
    <button class="btn btn-primary" onclick="registrar()">Registrarse</button>

    <div class="actions">
      <a href="login.html" class="link">← Ya tengo cuenta</a>
    </div>
  </div>
  <script src="js/registro.js"></script>
</body>
</html>
