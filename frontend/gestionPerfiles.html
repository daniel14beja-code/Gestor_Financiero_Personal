<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestorF – Gestión de Perfiles</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { padding: 0; align-items: stretch; }
  </style>
</head>
<body>

<div class="app-layout">

  <div id="sidebar"></div>

  <div class="main-content">
    <div class="topbar" style="max-width:900px;">
      <span>Gestión de <strong>Perfiles</strong></span>
      <div style="display:flex;gap:8px;">
        <a href="dashboard.html" class="btn btn-secondary">← Panel</a>
      </div>
    </div>

    <div id="mensaje" class="alert-error" style="display:none;max-width:900px;width:100%;margin:8px 0 16px;"></div>

    <div style="max-width:900px; width:100%; display:flex; gap:24px; margin-top:8px;">

      <div class="card" style="max-width:340px; height:fit-content;">
        <h2>Nuevo <span>Perfil</span></h2>
        <div class="form-group">
          <label for="nuevoPerfil">Nombre del perfil</label>
          <input type="text" id="nuevoPerfil" placeholder="ej: supervisor">
        </div>
        <button class="btn btn-primary" onclick="crearPerfil()">Crear perfil</button>
      </div>

      <div style="flex:1;">
        <h2 style="margin-bottom:16px;">Perfiles <span style="color:var(--accent)">registrados</span></h2>
        <div class="table-wrapper" style="max-width:100%;">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Perfil</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="tablaPerfiles">
              <tr><td colspan="3" style="text-align:center;color:var(--muted);">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card" style="max-width:900px; margin-top:24px;">
      <h2>Asignar <span>Perfil</span> a usuario</h2>
      <div style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;">
        <div class="form-group" style="margin-bottom:0; flex:1; min-width:200px;">
          <label for="selectUsuario">Usuario</label>
          <select id="selectUsuario"></select>
        </div>
        <div class="form-group" style="margin-bottom:0; flex:1; min-width:200px;">
          <label for="selectPerfil">Perfil a asignar</label>
          <select id="selectPerfil"></select>
        </div>
        <button class="btn btn-primary" style="width:auto;padding:10px 24px;" onclick="asignarPerfil()">Asignar</button>
      </div>
    </div>
  </div>

</div>

<script src="js/sidebar.js"></script>
<script src="js/gestionPerfiles.js"></script>
</body>
</html>
